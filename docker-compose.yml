services:
  orchestrator:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      RUST_LOG: info
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-screenshot-bot}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-screenshot-bot@users.noreply.github.com}
      GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME:-screenshot-bot}
      GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL:-screenshot-bot@users.noreply.github.com}
      GIT_SSH_COMMAND: "ssh -i /host-ssh/id_ed25519 -o UserKnownHostsFile=/host-ssh/known_hosts -o IdentitiesOnly=yes"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - roms:/roms:ro
      - ${PWD}/jobs:${PWD}/jobs
      - ${PWD}/repos:${PWD}/repos
      - ${PWD}/state:${PWD}/state
      - ${PWD}/secrets:${PWD}/secrets:ro
      - ${HOME}/.ssh:/host-ssh:ro
      - ./screenshotters:/screenshotters:ro
      - ./config.toml:/app/config.toml:ro
      - emudb-staging:/staging
    command: ["--config", "/app/config.toml"]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  emudb-staging:
    name: emudb-staging
  roms:
    driver: local
    driver_opts:
      type: cifs
      device: "//${SMB_HOST}/${SMB_SHARE}"
      o: "username=${SMB_USER},password=${SMB_PASS},ro,vers=3.0,uid=0,gid=0,file_mode=0444,dir_mode=0555,iocharset=utf8,nounix"
